services:
  insect-workbench:
    build: .
    container_name: insect-workbench
    ports:
      - "8000:8000"
    environment:
      INSECT_BOOTSTRAP_ADMIN_USERNAME: ${INSECT_BOOTSTRAP_ADMIN_USERNAME:-}
      INSECT_BOOTSTRAP_ADMIN_PASSWORD: ${INSECT_BOOTSTRAP_ADMIN_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-24}
      DEFAULT_USER_QUOTA: ${DEFAULT_USER_QUOTA:-100}
      # v1.3.5 稳定性配置(保留并发与预加载,前台优先+资源感知)
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-wal}
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-15000}
      RESOURCE_RECOGNITION_SLOTS: ${RESOURCE_RECOGNITION_SLOTS:-3}
      RESOURCE_MEMORY_PRESSURE_MB: ${RESOURCE_MEMORY_PRESSURE_MB:-256}
      MATERIAL_PREFETCH_SIZE: ${MATERIAL_PREFETCH_SIZE:-30}
      MATERIAL_PREFETCH_CONCURRENCY: ${MATERIAL_PREFETCH_CONCURRENCY:-3}
      MATERIAL_PREFETCH_RECOVERY_COOLDOWN_SECONDS: ${MATERIAL_PREFETCH_RECOVERY_COOLDOWN_SECONDS:-20}
      MATERIAL_STORAGE_MIN_FREE_GB: ${MATERIAL_STORAGE_MIN_FREE_GB:-5}
      MATERIAL_ARCHIVE_RETENTION_DAYS: ${MATERIAL_ARCHIVE_RETENTION_DAYS:-7}
    volumes:
      # 数据持久化: 容器内 /app/data 映射到宿主机(可用 INSECT_DATA_DIR 指向独立数据盘)
      - ${INSECT_DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
