services:
  insect-workbench:
    build: .
    container_name: insect-workbench
    ports:
      - "8000:8000"
    environment:
      INSECT_BOOTSTRAP_ADMIN_USERNAME: ${INSECT_BOOTSTRAP_ADMIN_USERNAME:-}
      INSECT_BOOTSTRAP_ADMIN_PASSWORD: ${INSECT_BOOTSTRAP_ADMIN_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-24}
      DEFAULT_USER_QUOTA: ${DEFAULT_USER_QUOTA:-100}
    volumes:
      # 数据持久化: 容器内 /app/data 映射到宿主机 ./data
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
